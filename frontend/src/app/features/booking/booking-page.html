<h1>Book a branch appointment</h1>
<p class="lead">Please follow the steps below to choose a slot for your required service.</p>

<mat-stepper linear labelPosition="bottom" class="stepper">
  <ng-template matStepperIcon="edit" let-index="index">{{ index + 1 }}</ng-template>
  <ng-template matStepperIcon="done" let-index="index">{{ index + 1 }}</ng-template>

  <!-- Stepper moves on iff a service is chosen. -->
  <mat-step label="Service" [completed]="!!service()">
    <app-service-step [(selected)]="service" />
    <div class="actions">
      <button mat-flat-button matStepperNext [disabled]="!service()">Next</button>
    </div>
  </mat-step>

  <!-- Stepper moves on iff a branch is chosen. -->
  <mat-step label="Branch" [completed]="!!branch()">
    <app-branch-step [(selected)]="branch" />
    <div class="actions">
      <button mat-button matStepperPrevious>Back</button>
      <button mat-flat-button matStepperNext [disabled]="!branch()">Next</button>
    </div>
  </mat-step>

  <!-- Stepper moves on iff a time is chosen (not only if a date is chosen). -->
  <mat-step label="Date & time" [completed]="!!time()">
    <app-date-time-step [branch]="branch()" [(date)]="date" [(time)]="time" />
    <div class="actions">
      <button mat-button matStepperPrevious>Back</button>
      <button mat-flat-button matStepperNext [disabled]="!time()">Next</button>
    </div>
  </mat-step>

  <!-- Stepper moves on iff every compulsary detail is valid and POPIA consent is ticked. -->
  <mat-step label="Your details" [completed]="!!details()">
    <app-details-step [(details)]="details" />
    <div class="actions">
      <button mat-button matStepperPrevious>Back</button>
      <button mat-flat-button matStepperNext [disabled]="!details()">Next</button>
    </div>
  </mat-step>

  <!-- Summary of every choice -->
  <mat-step label="Confirm">
    <app-review-step
      [service]="service()"
      [branch]="branch()"
      [date]="date()"
      [time]="time()"
      [details]="details()"
    />
    <div class="actions">
      <button mat-button matStepperPrevious>Back</button>
    </div>
  </mat-step>
</mat-stepper>
